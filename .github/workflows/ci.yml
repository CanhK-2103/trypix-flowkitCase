name: FlowKit checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env: {POSTGRES_USER: flowkit, POSTGRES_PASSWORD: flowkit, POSTGRES_DB: flowkit_test}
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U flowkit -d flowkit_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://flowkit:flowkit@localhost:5432/flowkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout=6m
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: sqlc generate && git diff --exit-code -- internal/storage/dbgen
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24.21.0, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
