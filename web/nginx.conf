events {}
http {
  include /etc/nginx/mime.types;
  log_format json escape=json '{"time":"$time_iso8601","level":"INFO","service":"gateway","run_id":null,"node_id":null,"attempt":null,"event":"http.access","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  # Re-resolve Compose service addresses after an API container replacement.
  resolver 127.0.0.11 valid=2s ipv6=off;
  resolver_timeout 2s;
  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    location ~ ^/(models|workflows|runs|artifacts|health)(/|$) {
      set $api_backend http://api:8080;
      proxy_pass $api_backend;
      proxy_next_upstream off;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 40s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
