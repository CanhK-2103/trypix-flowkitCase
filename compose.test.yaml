name: flowkit-tests
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: flowkit
      POSTGRES_PASSWORD: flowkit
      POSTGRES_DB: flowkit_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U flowkit -d flowkit_test]
      interval: 1s
      timeout: 3s
      retries: 30
